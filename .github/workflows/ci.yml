name: MV3 electrical core
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e native-host/python
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: python -m unittest discover -s native-host/python/tests -v
      - run: node --import tsx tools/benchmark-electrical.mjs docs/fixtures/dgs-smoke-from-20260923.json kontrol1/20260923_1200_SN3_TR0.json kontrol1/20260925_1000_SN5_TR0.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: UI and screenshot review
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: artifacts/ui-review/
          if-no-files-found: warn
          retention-days: 14
